# Every change is tested in full; only a change that passes every test is
# published as a new version, which the shop's program then installs by itself.
name: Test and publish

on:
  push:
    branches: [main, "claude/aluminum-cad-cam-system-dxfni8"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The branch the shop's program follows. Pushes elsewhere are tested, not published.
  RELEASE_BRANCH: claude/aluminum-cad-cam-system-dxfni8

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libraries the interface needs to run headless
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The test tools too: the newest starlette's test client needs httpx2.
          pip install -e ".[dev]"

      - name: The whole test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q -p no:cacheprovider

      # Only the newest tested commit becomes a version: a re-run of an old
      # run, or a run overtaken by a newer push, would publish old code
      # under a newer number — and every shop would "update" backwards.
      - name: Is this still the newest commit?
        id: guard
        if: github.ref_name == env.RELEASE_BRANCH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}" | cut -f1)
          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "A re-run: not published." ; echo "publish=no" >> "$GITHUB_OUTPUT"
          elif [ "$tip" != "${{ github.sha }}" ]; then
            echo "The branch moved on ($tip): not published." ; echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the version
        id: build
        if: steps.guard.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          python tools/build_release.py --out dist --run ${{ github.run_number }} \
            --commit ${{ github.sha }} --branch ${{ github.ref_name }} --after "${latest#v}"

      - name: Publish it
        if: steps.guard.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.build.outputs.version }}" dist/*.zip dist/release.json \
            --title "ProfileOS ${{ steps.build.outputs.version }}" \
            --notes-file dist/notes.md --target "${{ github.sha }}" --latest
