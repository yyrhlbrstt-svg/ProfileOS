[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profileos"
version = "0.1.0"
description = "Integrated CAD/CAM, structural analysis, 1D nesting and CNC post-processing suite for architectural aluminium profile systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ProfileOS" }]

dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "shapely>=2.0",
    "ezdxf>=1.1",
    "Jinja2>=3.1",
    "cryptography>=41.0",
    "cbor2>=5.6",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
analysis = ["sectionproperties>=3.2"]
nesting = ["ortools>=9.8"]
ui = ["PySide6>=6.6", "matplotlib>=3.8"]
mes = ["segno>=1.5"]
catalogue = ["pypdf>=4.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "jsonschema>=4.20"]
all = [
    "sectionproperties>=3.2",
    "pypdf>=4.0",
    "ortools>=9.8",
    "PySide6>=6.6",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "segno>=1.5",
]

[project.scripts]
profileos = "profileos.cli:main"

[tool.setuptools.packages.find]
include = ["profileos*"]

[tool.setuptools.package-data]
profileos = [
    "**/*.j2",
    "**/*.json",
    "**/*.qss",
    "**/*.ttf",
    "**/*.woff2",
    "**/*.txt",
    "**/*.dxf",
    "**/*.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
